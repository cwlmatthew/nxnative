name: Build nxnative Engine

on:
  workflow_dispatch: # 允许你手动触发这个工作流

jobs:
  build-engine:
    runs-on: macos-latest # 使用 GitHub 托管的 macOS 运行器

    env:
      GAME: "010015100B514000"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Accept Xcode License
        run: |
          sudo xcodebuild -license accept
          # 可能还需要运行首次启动安装程序，可选项
          sudo xcodebuild -runFirstLaunch

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install Homebrew dependencies
        run: |
          brew install xcodegen zstd glslang
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'  
          
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic

      - name: Run CPU-only tests
        run: |
          python3 -m pytest \
            dm/tools/tests \
            dm/ios/tests \
            --ignore=dm/gfx/tests \
            -v
      
      - name: Build engine
        run: |
          # 请根据 nxnative/docs/development.md 替换为实际的构建命令
          # 例如，如果存在一个 build.sh 脚本：
          # ./build.sh --engine-only
          echo "scripts/build_ipa_from_nsp.py"

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-engine-build
          path: |
            # 将这里替换为构建产物实际输出的目录
            # 例如，如果引擎二进制文件在 build/ 目录下：
            build/
            # 或者包含编译好的引擎的特定文件夹
